name: Deploy

# Деплой монорепо tutorsdesk (backend Node/ts-node + frontend Vite) через self-hosted runner на VM.
# На push в main: checkout -> rsync кода в боевую папку -> backend (prisma generate + pm2 restart)
#                 -> frontend (vite build -> копия dist в nginx-root /var/www/html).
# Данные на сервере НЕ трогаются: нет --delete, БД/uploads/.env исключены, миграций БД нет.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-reports
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, reports]
    steps:
      - uses: actions/checkout@v4

      - name: Sync, build & restart
        run: |
          set -euo pipefail
          APP_DIR="/home/ubuntu/student-reports-app"   # бэкенд: pm2 student-reports-api (:3001)
          WEB_ROOT="/var/www/html"                     # nginx-root домена tutorsdesk.ru (SPA)

          # Синхронизация кода. БЕЗ --delete. Исключаем серверные данные/секреты/сборки.
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' --exclude '.env.*' \
            --exclude 'frontend/dist' \
            --exclude 'backend/uploads' \
            --exclude 'backend/exports' \
            --exclude 'backend/database-backup' \
            --exclude '*.db' --exclude '*.sqlite' \
            ./ "$APP_DIR/"

          # --- Backend (ts-node через pm2) ---
          cd "$APP_DIR/backend"
          npm install
          npx prisma generate          # генерация клиента; схему/данные НЕ меняет
          pm2 restart student-reports-api --update-env

          # --- Frontend (Vite -> dist -> nginx root) ---
          cd "$APP_DIR/frontend"
          npm install
          npm run build                # = npx vite build -> создаёт dist/
          cp -r dist/. "$WEB_ROOT/"    # копируем содержимое (без удаления чужих файлов)

          echo "✅ student-reports-app deployed -> https://tutorsdesk.ru"
